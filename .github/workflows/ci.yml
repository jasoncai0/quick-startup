name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 固定 Python 版本
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 锁文件必须是最新的
        run: |
          python3 scripts/make-manifest.py .
          if ! git diff --exit-code -- skills/manifest.tsv; then
            echo "::error::skills/manifest.tsv 过期，请本地运行 make manifest 后提交"
            exit 1
          fi

      - name: 集成测试
        run: ./tests/run.sh

      - name: 仓库自检
        run: ./scripts/verify.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -x scripts/*.sh tests/run.sh

      - name: Python 语法与静态检查
        run: |
          python3 -m py_compile scripts/*.py
          pip install --quiet ruff
          ruff check --select E9,F scripts/

      - name: Makefile 与 YAML 可解析
        run: |
          make -n all >/dev/null
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              sys.exit(0)  # 没装 pyyaml 就跳过
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
              print(f'{f} OK')
          PY

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 脱敏检查（含全部历史）
        run: python3 scripts/check_privacy.py . --history

      # 不用 gitleaks-action：它在 force push 后会用事件里的 before..after 区间，
      # 而旧 base commit 已不可达，直接报 ambiguous argument。改为固定版本 + 校验和 + 全历史扫描。
      - name: gitleaks 全历史扫描
        run: |
          set -euo pipefail
          VERSION=8.24.3
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSL -o gitleaks.tgz  "${BASE}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "${BASE}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --redact --no-banner --exit-code 1 -v
